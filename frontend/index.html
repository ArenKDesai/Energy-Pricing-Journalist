<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>MISO RT LMP</title>
        <style>
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            body {
                background: #0d1117;
                color: #c9d1d9;
                font-family: Arial, sans-serif;
                height: 100vh;
                display: flex;
                flex-direction: column;
                overflow: hidden;
            }

            #header {
                flex: 0 0 auto;
                padding: 14px 20px 10px;
                border-bottom: 1px solid #21262d;
            }

            h1 {
                color: #aaf0c1;
                font-size: 20px;
                margin-bottom: 8px;
            }

            #controls {
                display: flex;
                align-items: center;
                gap: 16px;
                flex-wrap: wrap;
            }

            label {
                font-size: 14px;
            }

            select {
                background: #161b22;
                color: #c9d1d9;
                border: 1px solid #30363d;
                padding: 4px 8px;
                font-size: 14px;
                margin-left: 6px;
                border-radius: 4px;
            }

            #status {
                font-size: 13px;
                color: #8b949e;
            }

            #chart-container {
                flex: 1;
                position: relative;
                min-height: 0;
            }

            canvas {
                width: 100%;
                height: 100%;
                display: block;
            }

            #axes-canvas {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                pointer-events: none;
            }

            #error-msg {
                display: none;
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                color: #f85149;
                font-size: 15px;
                text-align: center;
                max-width: 400px;
                line-height: 1.5;
                z-index: 10;
            }
        </style>
    </head>
    <body>
        <div id="header">
            <h1>MISO Real-Time LMP</h1>
            <div id="controls">
                <label
                    >Location:
                    <select id="location-select"></select
                ></label>
                <span id="status">Loading...</span>
            </div>
        </div>

        <div id="chart-container">
            <canvas id="canvas"></canvas>
            <canvas id="axes-canvas"></canvas>
            <div id="error-msg"></div>
        </div>

        <script type="module">
            // --- Configuration ---
            // For local dev (docker compose): leave as-is.
            // For GCP deployment: set to your bucket's public URL, e.g.:
            const DATA_URL =
                "https://storage.googleapis.com/realtime-energy-prices/latest.json";
            // const DATA_URL = "/latest.json";
            const REFRESH_INTERVAL_MS = 5 * 60 * 1000; // 5 minutes

            // Plot margins in CSS pixels (left reserved for Y labels, bottom for X labels)
            const MARGIN = { left: 68, right: 20, top: 24, bottom: 48 };

            // --- WGSL shaders ---
            const SHADER = `
struct VOut {
    @builtin(position) pos: vec4f,
    @location(0) val: f32,
}

@vertex
fn vs(@location(0) xy: vec2f, @location(1) val: f32) -> VOut {
    var out: VOut;
    out.pos = vec4f(xy, 0.0, 1.0);
    out.val = val;
    return out;
}

// Positive: mint(#aaf0c1) → amber(#ffaa00) → deep red(#ff1a1a)
// Negative: mint(#aaf0c1) → cyan(#00ddff) → electric purple(#8800ff)
fn priceColor(val: f32) -> vec3f {
    let t = clamp(abs(val), 0.0, 1.0);
    if val >= 0.0 {
        if t < 0.5 {
            let s = t * 2.0;
            return vec3f(mix(0.667, 1.0, s), mix(0.941, 0.667, s), mix(0.757, 0.0, s));
        } else {
            let s = (t - 0.5) * 2.0;
            return vec3f(1.0, mix(0.667, 0.1, s), mix(0.0, 0.1, s));
        }
    } else {
        if t < 0.5 {
            let s = t * 2.0;
            return vec3f(mix(0.667, 0.0, s), mix(0.941, 0.867, s), mix(0.757, 1.0, s));
        } else {
            let s = (t - 0.5) * 2.0;
            return vec3f(mix(0.0, 0.533, s), mix(0.867, 0.0, s), 1.0);
        }
    }
}

@fragment
fn fs_line(in: VOut) -> @location(0) vec4f {
    return vec4f(priceColor(in.val), 1.0);
}

@fragment
fn fs_fill(in: VOut) -> @location(0) vec4f {
    let col = priceColor(in.val);
    let a = pow(abs(in.val), 0.8) * 0.6;
    return vec4f(col, a);
}
    `;

            // --- State ---
            let device = null;
            let context = null;
            let linePipeline = null;
            let fillPipeline = null;
            let canvasFormat = null;
            let currentData = null;

            const canvas = document.getElementById("canvas");
            const axesCanvas = document.getElementById("axes-canvas");
            const axesCtx = axesCanvas.getContext("2d");
            const locationSelect = document.getElementById("location-select");
            const statusEl = document.getElementById("status");
            const errorEl = document.getElementById("error-msg");

            function showError(msg) {
                errorEl.style.display = "block";
                errorEl.textContent = msg;
                statusEl.textContent = "Error";
            }

            function setStatus(msg) {
                statusEl.textContent = msg;
            }

            // --- WebGPU init ---
            async function initWebGPU() {
                if (!navigator.gpu) {
                    showError(
                        "WebGPU is not supported in this browser.\nTry Chrome 113+, Edge 113+, or Firefox Nightly.",
                    );
                    return false;
                }

                const adapter = await navigator.gpu.requestAdapter();
                if (!adapter) {
                    showError(
                        "No WebGPU adapter found. Your GPU may not be supported.",
                    );
                    return false;
                }

                device = await adapter.requestDevice();
                context = canvas.getContext("webgpu");
                canvasFormat = navigator.gpu.getPreferredCanvasFormat();
                context.configure({
                    device,
                    format: canvasFormat,
                    alphaMode: "opaque",
                });

                const shaderModule = device.createShaderModule({
                    code: SHADER,
                });

                // Shared vertex layout: [x, y, normVal] — 3 × float32 = 12 bytes
                const vertexLayout = {
                    arrayStride: 12,
                    attributes: [
                        { shaderLocation: 0, offset: 0, format: "float32x2" },
                        { shaderLocation: 1, offset: 8, format: "float32" },
                    ],
                };

                // Fill pipeline: triangle-list with src-alpha blending
                fillPipeline = device.createRenderPipeline({
                    layout: "auto",
                    vertex: {
                        module: shaderModule,
                        entryPoint: "vs",
                        buffers: [vertexLayout],
                    },
                    fragment: {
                        module: shaderModule,
                        entryPoint: "fs_fill",
                        targets: [
                            {
                                format: canvasFormat,
                                blend: {
                                    color: {
                                        srcFactor: "src-alpha",
                                        dstFactor: "one-minus-src-alpha",
                                        operation: "add",
                                    },
                                    alpha: {
                                        srcFactor: "one",
                                        dstFactor: "zero",
                                        operation: "add",
                                    },
                                },
                            },
                        ],
                    },
                    primitive: { topology: "triangle-list" },
                });

                // Line pipeline: line-strip, opaque
                linePipeline = device.createRenderPipeline({
                    layout: "auto",
                    vertex: {
                        module: shaderModule,
                        entryPoint: "vs",
                        buffers: [vertexLayout],
                    },
                    fragment: {
                        module: shaderModule,
                        entryPoint: "fs_line",
                        targets: [{ format: canvasFormat }],
                    },
                    primitive: { topology: "line-strip" },
                });

                return true;
            }

            // --- Scale helpers ---
            function niceNum(range, round) {
                if (range === 0) return 1;
                const exp = Math.floor(Math.log10(range));
                const f = range / Math.pow(10, exp);
                let nf;
                if (round) {
                    if (f < 1.5) nf = 1;
                    else if (f < 3) nf = 2;
                    else if (f < 7) nf = 5;
                    else nf = 10;
                } else {
                    if (f <= 1) nf = 1;
                    else if (f <= 2) nf = 2;
                    else if (f <= 5) nf = 5;
                    else nf = 10;
                }
                return nf * Math.pow(10, exp);
            }

            function niceScale(dataMin, dataMax, maxTicks = 6) {
                if (dataMin === dataMax) {
                    dataMin -= 1;
                    dataMax += 1;
                }
                const range = niceNum(dataMax - dataMin, false);
                const step = niceNum(range / (maxTicks - 1), true);
                const niceMin = Math.floor(dataMin / step) * step;
                const niceMax = Math.ceil(dataMax / step) * step;
                return { min: niceMin, max: niceMax, step };
            }

            // Pick a round time interval that yields ~5–6 tick marks
            function niceTimeStep(rangeSeconds) {
                const steps = [
                    60, 300, 600, 900, 1800, 3600, 7200, 14400, 21600, 43200,
                    86400,
                ];
                const ideal = rangeSeconds / 5;
                return steps.find((s) => s >= ideal) || steps[steps.length - 1];
            }

            function formatTimeLabel(unixSeconds, rangeSeconds) {
                const opts = { hour: "2-digit", minute: "2-digit" };
                if (rangeSeconds >= 86400) {
                    opts.month = "short";
                    opts.day = "numeric";
                }
                return new Date(unixSeconds * 1000).toLocaleString(
                    undefined,
                    opts,
                );
            }

            function formatPrice(v, step) {
                const decimals = step < 1 ? 2 : step < 10 ? 1 : 0;
                return v.toFixed(decimals);
            }

            // --- WebGPU rendering ---
            // Maps data into clip space respecting MARGIN so the 2D axes overlay aligns.
            function renderSeries(seriesPoints, tMin, tMax, yMin, yMax) {
                if (
                    !device ||
                    !linePipeline ||
                    !fillPipeline ||
                    !seriesPoints ||
                    seriesPoints.length < 2
                )
                    return;

                const dpr = window.devicePixelRatio || 1;
                const W = canvas.width;
                const H = canvas.height;

                const xMinClip = -1 + (2 * MARGIN.left * dpr) / W;
                const xMaxClip = 1 - (2 * MARGIN.right * dpr) / W;
                const yMinClip = -1 + (2 * MARGIN.bottom * dpr) / H;
                const yMaxClip = 1 - (2 * MARGIN.top * dpr) / H;

                const tRange = tMax - tMin || 1;
                const yRange = yMax - yMin || 1;

                function cx(t) {
                    return (
                        xMinClip + ((t - tMin) / tRange) * (xMaxClip - xMinClip)
                    );
                }
                function cy(v) {
                    return (
                        yMinClip + ((v - yMin) / yRange) * (yMaxClip - yMinClip)
                    );
                }

                // Normalize prices to [-1, 1] based on max absolute price.
                // normVal(0) = 0; normVal(maxPrice) = +1; normVal(minPrice) = -1
                const maxAbsPrice = Math.max(
                    ...seriesPoints.map((p) => Math.abs(p[1])),
                    1e-6,
                );
                function nv(price) {
                    return price / maxAbsPrice;
                }

                const clipYZero = cy(0);

                // --- Line vertices: [x, y, normVal] per point ---
                const lineVerts = new Float32Array(seriesPoints.length * 3);
                for (let i = 0; i < seriesPoints.length; i++) {
                    lineVerts[i * 3] = cx(seriesPoints[i][0]);
                    lineVerts[i * 3 + 1] = cy(seriesPoints[i][1]);
                    lineVerts[i * 3 + 2] = nv(seriesPoints[i][1]);
                }

                // --- Fill vertices: triangle-list ---
                // For each pair of adjacent points, emit a quad (2 triangles) between
                // the price line and the zero line.  At sign changes, interpolate the
                // zero-crossing so positive and negative fills never overlap.
                const fillArr = [];
                function tri(x0, y0, v0, x1, y1, v1, x2, y2, v2) {
                    fillArr.push(x0, y0, v0, x1, y1, v1, x2, y2, v2);
                }

                for (let i = 1; i < seriesPoints.length; i++) {
                    const xa = cx(seriesPoints[i - 1][0]);
                    const ya = cy(seriesPoints[i - 1][1]);
                    const va = nv(seriesPoints[i - 1][1]);
                    const xb = cx(seriesPoints[i][0]);
                    const yb = cy(seriesPoints[i][1]);
                    const vb = nv(seriesPoints[i][1]);
                    const pa = seriesPoints[i - 1][1];
                    const pb = seriesPoints[i][1];
                    const yZ = clipYZero;

                    if (pa >= 0 === pb >= 0) {
                        // Same side of zero — fill as a quad
                        tri(xa, ya, va, xa, yZ, 0, xb, yb, vb);
                        tri(xa, yZ, 0, xb, yZ, 0, xb, yb, vb);
                    } else {
                        // Zero crossing — split fill at the crossing point
                        const t = pa / (pa - pb);
                        const xC = xa + t * (xb - xa);
                        // Segment from A to crossing (A's sign)
                        tri(xa, ya, va, xa, yZ, 0, xC, yZ, 0);
                        // Segment from crossing to B (B's sign)
                        tri(xC, yZ, 0, xb, yb, vb, xb, yZ, 0);
                    }
                }

                const fillVerts = new Float32Array(fillArr);

                // --- GPU buffers ---
                const lineBuf = device.createBuffer({
                    size: lineVerts.byteLength,
                    usage: GPUBufferUsage.VERTEX | GPUBufferUsage.COPY_DST,
                });
                device.queue.writeBuffer(lineBuf, 0, lineVerts);

                let fillBuf = null;
                if (fillVerts.length > 0) {
                    fillBuf = device.createBuffer({
                        size: fillVerts.byteLength,
                        usage: GPUBufferUsage.VERTEX | GPUBufferUsage.COPY_DST,
                    });
                    device.queue.writeBuffer(fillBuf, 0, fillVerts);
                }

                // --- Single render pass: fill first, then line on top ---
                const encoder = device.createCommandEncoder();
                const pass = encoder.beginRenderPass({
                    colorAttachments: [
                        {
                            view: context.getCurrentTexture().createView(),
                            clearValue: { r: 0.051, g: 0.067, b: 0.09, a: 1.0 },
                            loadOp: "clear",
                            storeOp: "store",
                        },
                    ],
                });

                if (fillBuf) {
                    pass.setPipeline(fillPipeline);
                    pass.setVertexBuffer(0, fillBuf);
                    pass.draw(fillVerts.length / 3);
                }

                pass.setPipeline(linePipeline);
                pass.setVertexBuffer(0, lineBuf);
                pass.draw(seriesPoints.length);

                pass.end();
                device.queue.submit([encoder.finish()]);
            }

            // --- Annotation bubble helper ---
            // Draws a two-line bubble (label + value) with a dashed stem and dot
            // pointing at (dataX, dataY) in CSS-pixel plot coordinates.
            function drawBubble(ctx, dataX, dataY, label, valueStr, color, pL, pR, pT, pB) {
                const ARROW_GAP = 11;
                const PAD_X    = 9;
                const PAD_Y    = 5;
                const SZ_LABEL = 10;
                const SZ_VALUE = 13;

                ctx.font = `bold ${SZ_LABEL}px Arial`;
                const labelW = ctx.measureText(label).width;
                ctx.font = `bold ${SZ_VALUE}px Arial`;
                const valueW = ctx.measureText(valueStr).width;

                const bw = Math.max(labelW, valueW) + PAD_X * 2;
                const bh = SZ_LABEL + SZ_VALUE + PAD_Y * 2 + 4;

                // Place above if there is more vertical room there
                const placeAbove = (dataY - pT) > (pB - dataY);
                let bx = dataX - bw / 2;
                let by = placeAbove ? dataY - ARROW_GAP - bh : dataY + ARROW_GAP;

                // Clamp inside the plot area
                bx = Math.max(pL + 2, Math.min(pR - bw - 2, bx));
                by = Math.max(pT + 2, Math.min(pB - bh - 2, by));

                const stemX = bx + bw / 2;
                const stemY = placeAbove ? by + bh : by;

                // Dashed stem from bubble edge to data point
                ctx.strokeStyle = color;
                ctx.lineWidth = 1;
                ctx.setLineDash([3, 3]);
                ctx.beginPath();
                ctx.moveTo(stemX, stemY);
                ctx.lineTo(dataX, dataY);
                ctx.stroke();
                ctx.setLineDash([]);

                // Dot at the data point
                ctx.fillStyle = color;
                ctx.beginPath();
                ctx.arc(dataX, dataY, 3.5, 0, Math.PI * 2);
                ctx.fill();

                // Bubble background + border
                ctx.fillStyle = "rgba(13, 17, 23, 0.92)";
                ctx.strokeStyle = color;
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.roundRect(bx, by, bw, bh, 5);
                ctx.fill();
                ctx.stroke();

                // Label line  (e.g. "HIGH")
                ctx.fillStyle = color;
                ctx.font = `bold ${SZ_LABEL}px Arial`;
                ctx.textAlign = "center";
                ctx.textBaseline = "top";
                ctx.fillText(label, bx + bw / 2, by + PAD_Y);

                // Value line  (e.g. "$45.20")
                ctx.fillStyle = "#e6edf3";
                ctx.font = `bold ${SZ_VALUE}px Arial`;
                ctx.fillText(valueStr, bx + bw / 2, by + PAD_Y + SZ_LABEL + 4);
            }

            // --- 2D axes overlay ---
            function renderAxes(tMin, tMax, yMin, yMax, yStep, seriesPoints) {
                const dpr = window.devicePixelRatio || 1;
                const W = axesCanvas.width;
                const H = axesCanvas.height;
                const cssW = W / dpr;
                const cssH = H / dpr;

                // Work in CSS pixels
                axesCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
                axesCtx.clearRect(0, 0, cssW, cssH);

                const pL = MARGIN.left;
                const pR = cssW - MARGIN.right;
                const pT = MARGIN.top;
                const pB = cssH - MARGIN.bottom;
                const pW = pR - pL;
                const pH = pB - pT;

                const tRange = tMax - tMin || 1;
                const yRange = yMax - yMin || 1;

                // --- Mask WebGPU canvas in the margin strips ---
                axesCtx.fillStyle = "#0d1117";
                axesCtx.fillRect(0, 0, pL, cssH); // left
                axesCtx.fillRect(0, 0, cssW, pT); // top
                axesCtx.fillRect(pR, 0, cssW - pR, cssH); // right
                axesCtx.fillRect(0, pB, cssW, cssH - pB); // bottom

                // --- Y gridlines & labels ---
                const yTickCount = Math.round((yMax - yMin) / yStep) + 1;
                for (let i = 0; i < yTickCount; i++) {
                    const v = yMin + i * yStep;
                    if (v < yMin - yStep * 0.01 || v > yMax + yStep * 0.01)
                        continue;
                    const y = pB - ((v - yMin) / yRange) * pH;
                    const isZero = Math.abs(v) < yStep * 0.01;

                    // Gridline — zero line gets a distinct dashed style
                    if (isZero) {
                        axesCtx.strokeStyle = "#3a4a3e";
                        axesCtx.lineWidth = 1;
                        axesCtx.setLineDash([5, 4]);
                    } else {
                        axesCtx.strokeStyle = "#21262d";
                        axesCtx.lineWidth = 1;
                        axesCtx.setLineDash([]);
                    }
                    axesCtx.beginPath();
                    axesCtx.moveTo(pL, y);
                    axesCtx.lineTo(pR, y);
                    axesCtx.stroke();
                    axesCtx.setLineDash([]);

                    // Tick mark
                    axesCtx.strokeStyle = isZero ? "#aaf0c1" : "#30363d";
                    axesCtx.beginPath();
                    axesCtx.moveTo(pL - 5, y);
                    axesCtx.lineTo(pL, y);
                    axesCtx.stroke();

                    // Label
                    axesCtx.fillStyle = isZero ? "#aaf0c1" : "#8b949e";
                    axesCtx.font = isZero ? "bold 11px Arial" : "11px Arial";
                    axesCtx.textAlign = "right";
                    axesCtx.textBaseline = "middle";
                    axesCtx.fillText(formatPrice(v, yStep), pL - 8, y);
                }

                // --- X gridlines & labels ---
                const timeStep = niceTimeStep(tRange);
                const firstTick = Math.ceil(tMin / timeStep) * timeStep;

                for (
                    let t = firstTick;
                    t <= tMax + timeStep * 0.01;
                    t += timeStep
                ) {
                    if (t > tMax + timeStep * 0.01) break;
                    const x = pL + ((t - tMin) / tRange) * pW;

                    // Gridline
                    axesCtx.strokeStyle = "#21262d";
                    axesCtx.lineWidth = 1;
                    axesCtx.beginPath();
                    axesCtx.moveTo(x, pT);
                    axesCtx.lineTo(x, pB);
                    axesCtx.stroke();

                    // Tick mark
                    axesCtx.strokeStyle = "#30363d";
                    axesCtx.beginPath();
                    axesCtx.moveTo(x, pB);
                    axesCtx.lineTo(x, pB + 5);
                    axesCtx.stroke();

                    // Label
                    axesCtx.fillStyle = "#8b949e";
                    axesCtx.font = "11px Arial";
                    axesCtx.textAlign = "center";
                    axesCtx.textBaseline = "top";
                    axesCtx.fillText(formatTimeLabel(t, tRange), x, pB + 8);
                }

                // --- Axis border (L-shape: left + bottom) ---
                axesCtx.strokeStyle = "#30363d";
                axesCtx.lineWidth = 1;
                axesCtx.beginPath();
                axesCtx.moveTo(pL, pT);
                axesCtx.lineTo(pL, pB);
                axesCtx.lineTo(pR, pB);
                axesCtx.stroke();

                // --- Y axis title ---
                axesCtx.save();
                axesCtx.translate(13, pT + pH / 2);
                axesCtx.rotate(-Math.PI / 2);
                axesCtx.fillStyle = "#8b949e";
                axesCtx.font = "11px Arial";
                axesCtx.textAlign = "center";
                axesCtx.textBaseline = "middle";
                axesCtx.fillText("$/MWh", 0, 0);
                axesCtx.restore();

                // --- Price annotation bubbles ---
                if (seriesPoints && seriesPoints.length > 0) {
                    // Find indices for highest, lowest, and current (last) point
                    let hiIdx = 0, loIdx = 0;
                    for (let i = 1; i < seriesPoints.length; i++) {
                        if (seriesPoints[i][1] > seriesPoints[hiIdx][1]) hiIdx = i;
                        if (seriesPoints[i][1] < seriesPoints[loIdx][1]) loIdx = i;
                    }
                    const nowIdx = seriesPoints.length - 1;

                    function plotX(t) { return pL + ((t - tMin) / tRange) * pW; }
                    function plotY(v) { return pB - ((v - yMin) / yRange) * pH; }

                    function bubbleFmt(v) {
                        const abs = Math.abs(v);
                        const d   = abs >= 100 ? 1 : 2;
                        return (v < 0 ? "\u2212" : "") + "$" + abs.toFixed(d);
                    }

                    const hiPt  = seriesPoints[hiIdx];
                    const loPt  = seriesPoints[loIdx];
                    const nowPt = seriesPoints[nowIdx];

                    // Draw HIGH and LOW first, then NOW on top
                    drawBubble(axesCtx,
                        plotX(hiPt[0]), plotY(hiPt[1]),
                        "HIGH", bubbleFmt(hiPt[1]),
                        "#ff9944", pL, pR, pT, pB);

                    drawBubble(axesCtx,
                        plotX(loPt[0]), plotY(loPt[1]),
                        "LOW", bubbleFmt(loPt[1]),
                        "#44ccff", pL, pR, pT, pB);

                    drawBubble(axesCtx,
                        plotX(nowPt[0]), plotY(nowPt[1]),
                        "NOW", bubbleFmt(nowPt[1]),
                        "#aaf0c1", pL, pR, pT, pB);
                }
            }

            function clearCanvas() {
                if (!device || !context || !linePipeline) return;
                const encoder = device.createCommandEncoder();
                const pass = encoder.beginRenderPass({
                    colorAttachments: [
                        {
                            view: context.getCurrentTexture().createView(),
                            clearValue: {
                                r: 0.051,
                                g: 0.067,
                                b: 0.09,
                                a: 1.0,
                            },
                            loadOp: "clear",
                            storeOp: "store",
                        },
                    ],
                });
                pass.end();
                device.queue.submit([encoder.finish()]);

                const dpr = window.devicePixelRatio || 1;
                axesCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
                axesCtx.clearRect(
                    0,
                    0,
                    axesCanvas.width / dpr,
                    axesCanvas.height / dpr,
                );
            }

            // --- Data loading ---
            async function fetchData() {
                try {
                    const resp = await fetch(DATA_URL, { cache: "no-cache" });
                    if (!resp.ok) {
                        setStatus(`Waiting for data... (HTTP ${resp.status})`);
                        return;
                    }
                    currentData = await resp.json();

                    // Populate location dropdown on first load
                    if (locationSelect.options.length === 0) {
                        currentData.locations.forEach((loc) => {
                            const opt = document.createElement("option");
                            opt.value = opt.textContent = loc;
                            locationSelect.appendChild(opt);
                        });
                    }

                    const updated = new Date(currentData.updated);
                    setStatus(`Updated: ${updated.toLocaleString()}`);
                    renderSelected();
                } catch (e) {
                    setStatus(`Fetch error: ${e.message}`);
                }
            }

            function renderSelected() {
                if (!currentData) return;
                const loc = locationSelect.value;
                const pts = currentData.series[loc];
                if (pts && pts.length > 0) {
                    const times = pts.map((p) => p[0]);
                    const lmps = pts.map((p) => p[1]);
                    const tMin = Math.min(...times),
                        tMax = Math.max(...times);
                    const lmpMin = Math.min(...lmps),
                        lmpMax = Math.max(...lmps);
                    const yScale = niceScale(lmpMin, lmpMax, 6);
                    renderSeries(pts, tMin, tMax, yScale.min, yScale.max);
                    renderAxes(tMin, tMax, yScale.min, yScale.max, yScale.step, pts);
                } else {
                    clearCanvas();
                }
            }

            // --- Canvas resize ---
            function onResize() {
                const dpr = window.devicePixelRatio || 1;
                const w = Math.floor(canvas.clientWidth * dpr);
                const h = Math.floor(canvas.clientHeight * dpr);
                canvas.width = w;
                canvas.height = h;
                axesCanvas.width = w;
                axesCanvas.height = h;
                renderSelected();
            }

            // --- Entry point ---
            async function main() {
                const ok = await initWebGPU();
                if (!ok) return;

                new ResizeObserver(onResize).observe(canvas);
                onResize();

                locationSelect.addEventListener("change", renderSelected);

                await fetchData();
                setInterval(fetchData, REFRESH_INTERVAL_MS);
            }

            main();
        </script>
    </body>
</html>
