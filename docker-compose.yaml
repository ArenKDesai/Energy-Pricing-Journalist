services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - .env
    volumes:
      - .:/app
    # No ports needed for backend as it pushes to S3/R2

  # Keep frontend here for local testing if desired
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "8050:8050"
    env_file:
      - .env