services:
  collector:
    build: ./collector
    environment:
      LOCAL_DEV: "true"
      DATA_DIR: /data
    volumes:
      - ./data:/data
    restart: unless-stopped

  web:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/frontend:ro
      - ./data:/data:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - collector
    restart: unless-stopped
